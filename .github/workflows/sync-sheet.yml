name: Sync public Google Sheet to property website
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_sheet.py'
      - 'scripts/collect_photos.py'
      - '.github/workflows/sync-sheet.yml'

permissions:
  contents: write

concurrency:
  group: property-google-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP reader
        run: python -m pip install --disable-pip-version-check requests
      - name: Read public Google Sheet and validate property rows
        run: python scripts/refresh_sheet.py
      - name: Read each source listing's public photo metadata (best-effort)
        run: python scripts/collect_photos.py
      - name: Publish new website data only when properties or photos change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheet-data.json listing-photos.json
          if git diff --cached --quiet; then
            echo "Sheet data unchanged"
          else
            git commit -m "data: refresh public Google Sheet listings [skip ci]"
            git push origin HEAD:main
          fi
