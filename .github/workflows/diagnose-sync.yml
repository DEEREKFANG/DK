name: Diagnose property website sync
on:
  push:
    paths:
      - '.github/workflows/diagnose-sync.yml'
      - 'index.html'
      - 'sheet-data.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing packages
        run: npm install --no-save jsdom@26 playwright-core@1.56
      - name: Reproduce synchronization in DOM
        run: |
          node <<'JS'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          const raw=fs.readFileSync('index.html','utf8');
          const injected=raw;
          const virtual=new VirtualConsole();
          virtual.on('error',(...args)=>console.error('JS_ERROR',...args));
          virtual.on('jsdomError',e=>console.error('DOM_ERROR',e.stack));
          const dom=new JSDOM(injected,{
            url:'https://deerekfang.github.io/DK/',
            runScripts:'dangerously',
            pretendToBeVisual:true,
            virtualConsole:virtual,
            beforeParse(w){
              w.scrollTo=()=>{};
              w.fetch=async (path)=>{
                if(path.includes('sheet-data.json')){
                  return {ok:true,json:async()=>JSON.parse(fs.readFileSync('sheet-data.json','utf8'))};
                }
                if(path.includes('listing-status.json')){
                  return {ok:true,json:async()=>JSON.parse(fs.readFileSync('listing-status.json','utf8'))};
                }
                throw Error('Unexpected fetch '+path);
              };
            }
          });
          setTimeout(()=>{
            const w=dom.window;
            console.log('PAGE_TITLE',w.document.title);
            console.log('TOAST',w.document.getElementById('toast')?.textContent);
            console.log('SYNC_HINT',w.document.getElementById('syncHint')?.textContent);
            console.log('TOTAL',w.document.getElementById('sideTotal')?.textContent);
            console.log('CARDS',w.document.querySelectorAll('.house-card').length);
            const ok=!(w.document.getElementById('toast')?.textContent||'').includes('同步失敗');
            dom.window.close();
            if(!ok){process.exitCode=1}
          },1800);
          JS
      - name: Reproduce mobile Chrome rendering and old cache
        run: |
          python -m http.server 8811 --bind 127.0.0.1 >/tmp/site-server.log 2>&1 &
          node <<'JS'
          const fs=require('fs');
          const {chromium}=require('playwright-core');
          const candidates=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser','/opt/google/chrome/chrome'];
          const bin=candidates.find(p=>fs.existsSync(p));
          if(!bin)throw Error('No chromium executable on runner');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:bin,args:['--no-sandbox']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:3});
              page.on('console',m=>{if(m.type()==='error')console.log('CONSOLE_ERROR',m.text())});
              page.on('pageerror',e=>console.error('PAGE_ERROR',e.stack));
              await page.goto('http://127.0.0.1:8811/',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1800);
              const stats=async(tag)=>{const x=await page.evaluate(()=>({
                toast:document.getElementById('toast')?.textContent,
                width:document.documentElement.clientWidth,
                scrollWidth:document.documentElement.scrollWidth,
                bodyWidth:document.body.scrollWidth,
                cards:document.querySelectorAll('.house-card').length,
                offenders:[...document.querySelectorAll('body *')].map(x=>({tag:x.tagName,cls:String(x.className).slice(0,75),right:Math.round(x.getBoundingClientRect().right),width:Math.round(x.getBoundingClientRect().width)})).filter(z=>z.right>window.innerWidth+2).slice(0,12)
              }));console.log('CHROME_'+tag,JSON.stringify(x));return x};
              const result=await stats('FRESH');
              await page.locator('#mobileNav [data-nav="all"]').click();
              await page.selectOption('#fAge','under30');
              const young=await page.evaluate(()=>({count:filtered().length,invalid:filtered().filter(x=>buildingAge(x)===null||buildingAge(x)>30).map(x=>x.seq)}));
              console.log('AGE_FILTER_UNDER30',JSON.stringify(young));
              if(!young.count||young.invalid.length)throw Error('Under30 age filter invalid');
              await page.selectOption('#fAge','over30');
              const old=await page.evaluate(()=>({count:filtered().length,invalid:filtered().filter(x=>buildingAge(x)===null||buildingAge(x)<=30).map(x=>x.seq)}));
              console.log('AGE_FILTER_OVER30',JSON.stringify(old));
              if(!old.count||old.invalid.length)throw Error('Over30 age filter invalid');
              await page.selectOption('#fAge','unknown');
              const unknown=await page.evaluate(()=>({count:filtered().length,invalid:filtered().filter(x=>buildingAge(x)!==null).map(x=>x.seq)}));
              console.log('AGE_FILTER_UNKNOWN',JSON.stringify(unknown));
              if(!unknown.count||unknown.invalid.length)throw Error('Unknown age filter invalid');
              await page.selectOption('#fAge','all');
              await page.selectOption('#fSort','ageAsc');
              // Simulate user devices that saved a 60/61-property localStorage snapshot.
              const seed=await page.evaluate(()=>{
                const d=JSON.parse(localStorage.getItem('house_compare_taiwan_20261024_v2')||'null');
                return d;
              });
              await page.evaluate((old)=>{
                if(old){
                  localStorage.setItem('house_compare_taiwan_20261024_v2',JSON.stringify(old.slice(0,60)));
                }
              },seed);
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForTimeout(1800);
              const oldResult=await stats('OLD_LOCAL_STORAGE');
              if(result.toast?.includes('同步失敗')||oldResult.toast?.includes('同步失敗'))process.exitCode=1;
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack);process.exitCode=1});
          JS
