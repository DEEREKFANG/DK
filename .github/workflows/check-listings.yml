name: Daily home listing status check
on:
  schedule:
    - cron: '17 1 * * *' # Taiwan 09:17, UTC 01:17
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_listings.py'
      - '.github/workflows/check-listings.yml'

permissions:
  contents: write

concurrency:
  group: property-status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight site parsing packages
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Check all accessible individual listing URLs
        run: python scripts/check_listings.py
      - name: Save daily status snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listing-status.json
          if git diff --cached --quiet; then
            echo "No listing status changes"
          else
            git commit -m "chore: refresh property listing statuses [skip ci]"
            git push origin HEAD:main
          fi
