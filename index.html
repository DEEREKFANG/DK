async function loadListingChecks(){

const storageSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
const initialSaved=storageGet(KEY);
const savedValid=Array.isArray(initialSaved)?initialSaved.filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&x.id&&x.name):[];
const savedIds=new Set(savedValid.map(p=>p.id));
const initialProps=[...savedValid,...SEED_PROPERTIES.filter(p=>!savedIds.has(p.id)).map(p=>({...p}))];
let state={properties:initialProps, page:'height',q:'', district:'全部地區',kind:'all',ageRange:'all',status:'exclude',priceMax:0,order:'recommended',onlyBudget:false,dedup:true,favoritesOnly:false,table:false,compare:[],finance:{ltv:70,rate:2.5,years:30,target:20000},sync:storageGet(CONFIG_KEY)||{url:'https://docs.google.com/spreadsheets/d/1XP_8GXN9QRKbEGqYzBudjOYazADMJqYFf8gqMiADgS8/edit#gid=762574749',enabled:true,last:''}};
let toastTimer=null, syncInterval=null;
function save(){storageSave(KEY,state.properties)}
function notify(msg){let el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3700)}
const nf=(n)=>Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});
function mortgage(p){if(!yes(p.price))return null;const principal=Number(p.price)*10000*state.finance.ltv/100;const n=12*state.finance.years;const rate=state.finance.rate/100/12;if(n<=0)return null;return rate===0?principal/n:principal*rate/(1-Math.pow(1+rate,-n));}
function cardMonthly(p){let m=mortgage(p);return m===null?null:m+(number(p.management)||0)}
function districtList(){return [...new Set(state.properties.map(p=>p.district).filter(Boolean))].filter(x=>x!=='待查').sort((a,b)=>a.localeCompare(b,'zh-TW'))}
function canonical(items){let seen=new Set();return items.filter(p=>{let key=groupKey(p);if(seen.has(key))return false;seen.add(key);return true})}
function highCandidates(){return canonical(state.properties.filter(isHigh))}
function sorted(items){return items.sort((a,b)=>{let ar=recommended.indexOf(a.seq),br=recommended.indexOf(b.seq);switch(state.order){case'priceAsc':return (a.price??Infinity)-(b.price??Infinity);case'priceDesc':return (b.price??-1)-(a.price??-1);case'areaDesc':return (b.mainArea??-1)-(a.mainArea??-1);case'perPing':return ((a.price&&a.totalArea)?a.price/a.totalArea:Infinity)-((b.price&&b.totalArea)?b.price/b.totalArea:Infinity);case'recent':return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))||b.seq-a.seq;case'ageAsc':return (buildingAge(a)??Infinity)-(buildingAge(b)??Infinity)||a.seq-b.seq;case'ageDesc':return (buildingAge(b)??-1)-(buildingAge(a)??-1)||a.seq-b.seq;default: return (ar<0?99:ar)-(br<0?99:br)||a.seq-b.seq}})}
function filtered(){let items=[...state.properties];if(state.page==='height')items=items.filter(isHigh);if(state.page==='favorites')items=items.filter(p=>p.favorite);if(state.district!=='全部地區')items=items.filter(p=>p.district===state.district);if(state.kind!=='all')items=items.filter(p=>p.heightType===state.kind);if(state.status==='current')items=items.filter(p=>p.checkStatus==='reachable');if(state.status==='exclude')items=items.filter(p=>!['sold','removed'].includes(p.checkStatus)&&p.listingStatus!=='sold');if(state.onlyBudget)items=items.filter(p=>yes(p.price)&&p.price<=1100);if(state.priceMax>0)items=items.filter(p=>p.price!==null&&p.price<=state.priceMax);if(state.ageRange!=='all')items=items.filter(p=>{const n=buildingAge(p);if(state.ageRange==='unknown')return n===null;if(n===null)return false;switch(state.ageRange){case'under5':return n<=5;case'under10':return n<=10;case'under20':return n<=20;case'under30':return n<=30;case'over30':return n>30;case'6to10':return n>5&&n<=10;case'11to20':return n>10&&n<=20;case'21to30':return n>20&&n<=30;default:return true}});if(state.q.trim()){const q=state.q.trim().toLowerCase();items=items.filter(p=>[p.id,p.seq,p.name,p.district,p.purpose,p.metro,p.rooms,p.url,p.sourceNote,p.cons,p.pros,p.related].join(' ').toLowerCase().includes(q))}if(state.dedup)items=canonical(items);return sorted(items)}
function icon(type){let icons={home:'<path d="M3 10.5 12 3l9 7.5V21h-7v-6H10v6H3z"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 15l9 5 9-5"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',compare:'<rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="8" width="7" height="13" rx="1"/>',chart:'<path d="M3 20h18M6 17v-5M12 17V5M18 17V9"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4"/>',plus:'<path d="M12 5v14M5 12h14"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 1 0-7-7l-2 2M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>'};return`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[type]||icons.home}</svg>`}
function navLabels(){return[{page:'height',icon:'layers',name:'挑高 / 樓中樓'},{page:'all',icon:'home',name:'全部房源'},{page:'favorites',icon:'heart',name:'我的收藏'},{page:'compare',icon:'compare',name:'並排比較'},{page:'insights',icon:'chart',name:'預算與分析'},{page:'data',icon:'settings',name:'資料同步 / 管理'}]}
function setNav(){const nav=navLabels();$('#sidebarNav').innerHTML='<div class="nav-heading">房源工作台 / WORKSPACE</div>'+nav.map(n=>`<button class="nav-btn ${state.page===n.page?'active':''}" data-nav="${n.page}">${icon(n.icon)}${n.name}${n.page==='compare'&&state.compare.length?` <small>(${state.compare.length})</small>`:''}</button>`).join('');$('#mobileNav').innerHTML=nav.map(n=>`<button data-nav="${n.page}" class="${state.page===n.page?'active':''}">${n.name}</button>`).join('');$('#sideTotal').textContent=state.properties.length;$('#sideHigh').textContent=highCandidates().length+' 組挑高候選';$('#breadcrumb').textContent=(nav.find(n=>n.page===state.page)||nav[0]).name;$('#syncHint').textContent=state.sync.enabled?'雲端同步已開啟':'本機資料模式';}
function statsHTML(){let candidates=highCandidates();let prices=candidates.filter(p=>p.price!==null);return`<div class="stat-grid"><div class="stat"><i></i><div class="l">建檔房源</div><div class="v">${state.properties.length}</div><div class="s">含不同仲介重複來源</div></div><div class="stat"><i></i><div class="l">挑高候選組</div><div class="v">${candidates.length}</div><div class="s">已依相同刊登去重</div></div><div class="stat"><i></i><div class="l">總價 1,100萬以內</div><div class="v">${prices.filter(p=>p.price<=1100).length}</div><div class="s">僅挑高候選且有價格者</div></div><div class="stat"><i></i><div class="l">待完成核證</div><div class="v">${candidates.filter(p=>p.listingStatus!=='confirmed').length}</div><div class="s">刊登未確認／仍需查用途</div></div></div>`}
function headerHTML(){return`<div class="intro"><div><div class="eyebrow">PRIVATE HOME COLLECTION / 2026</div><h1 class="section-title">${state.page==='height'?'挑高・樓中樓精選':state.page==='all'?'全部房源資料庫':'已收藏的房子'}</h1><p class="subtext">以長期自住、室內主建物、松江南京站通勤及住房負擔作為評估核心。價格和狀態須逐戶重新確認。</p></div><div class="intro-actions"><button class="btn" data-action="exportCSV">匯出 CSV</button><button class="btn primary" data-action="add">${icon('plus')} 新增房源</button></div></div><section class="hero"><div class="hero-left"><div class="hero-small">HOME FINDER · REAL ESTATE STUDIO</div><h2>把每一間房子，放到同一個標準比較。</h2><p>同步整理 ${state.properties.length} 筆來源；挑高「本戶明示 / 現況夾層 / 社區待核」三類分開管理。新增房子可立即加入篩選與比較，資料亦可匯出備份。</p></div><div class="hero-graphic"><div class="skyscraper s1"></div><div class="skyscraper s2"></div><div class="skyscraper s3"></div></div></section>${statsHTML()}`}
function filterHTML(){const areas=districtList();return`<section class="panel filters"><div class="filter-grid"><div class="field"><label>搜尋房名 / 編號 / 捷運</label><input id="fSearch" placeholder="例如：捷仕堡、F1、金城閣…" value="${escapeHTML(state.q)}"></div><div class="field"><label>行政區</label><select id="fDistrict"><option>全部地區</option>${areas.map(a=>`<option ${state.district===a?'selected':''}>${escapeHTML(a)}</option>`).join('')}</select></div><div class="field"><label>樓高類別</label><select id="fKind"><option value="all">全部類別</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${state.kind===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>開價上限</label><select id="fPrice"><option value="0">不限金額</option>${[800,900,1000,1100,1200,1400].map(v=>`<option value="${v}" ${state.priceMax===v?'selected':''}>${money(v)} 萬以內</option>`).join('')}</select></div><div class="field"><label>屋齡</label><select id="fAge"><option value="all">不限屋齡</option>${[['under5','5年內'],['under10','10年內'],['under20','20年內'],['under30','30年內（優先）'],['6to10','超過5至10年'],['11to20','超過10至20年'],['21to30','超過20至30年'],['over30','超過30年'],['unknown','屋齡待查']].map(([k,v])=>`<option value="${k}" ${state.ageRange===k?'selected':''}>${v}</option>`).join('')}</select></div><div><button class="btn small" data-action="clearFilters">重設篩選</button></div></div><p class="helptext" style="margin:7px 0 13px">屋齡為2026/10附近刊登或社區資料的約略值；沒有明確資料的房屋顯示「待查」，不自動歸入30年內。</p><div class="chips"><button data-action="budgetToggle" class="chip ${state.onlyBudget?'active':''}">✓ 預算 ≤ 1,100萬</button><button data-action="dedupToggle" class="chip ${state.dedup?'active':''}">✓ 合併重複刊登</button><button data-action="statusToggle" class="chip ${state.status==='exclude'?'active':''}">✓ 隱藏已成交／下架</button><button data-action="sortRecommended" class="chip ${state.order==='recommended'?'active':''}">★ 原挑高推薦順序</button></div></section><div class="section-row"><h3>房源清單 <small id="resultCount"></small></h3><div class="section-controls"><select class="mini-select" id="fSort"><option value="recommended" ${state.order==='recommended'?'selected':''}>建議排序</option><option value="priceAsc" ${state.order==='priceAsc'?'selected':''}>總價：由低到高</option><option value="priceDesc" ${state.order==='priceDesc'?'selected':''}>總價：由高到低</option><option value="areaDesc" ${state.order==='areaDesc'?'selected':''}>主建物：由大到小</option><option value="perPing" ${state.order==='perPing'?'selected':''}>每坪：由低到高</option><option value="recent" ${state.order==='recent'?'selected':''}>更新時間</option><option value="ageAsc" ${state.order==='ageAsc'?'selected':''}>屋齡：新到舊</option><option value="ageDesc" ${state.order==='ageDesc'?'selected':''}>屋齡：舊到新</option></select><div class="view-tabs"><button class="${!state.table?'active':''}" data-action="viewCards">卡片</button><button class="${state.table?'active':''}" data-action="viewTable">表格</button></div></div></div><div id="results"></div>`}
function tagHTML(p){const k=p.heightType||'none';return`<span class="tag ${k.toLowerCase()}">${labels[k]||labels.none}</span>${p.price!==null&&p.price<=1100?'<span class="tag a">預算內</span>':''}${p.duplicateGroup?'<span class="tag neutral">關聯刊登</span>':''}${/工廠/.test(p.purpose||'')?'<span class="tag danger">工廠用途風險</span>':''}${checkTag(p)}`}
function houseCard(p){let on=state.compare.includes(p.id),height=p.height?'挑高 '+formatArea(p.height)+'m':(p.heightType==='B'?'夾層線索':p.heightType==='C'?'待確認':'電梯／住宅候選');const monthly=cardMonthly(p);return`<article class="house-card"><div class="card-banner ${p.heightType||'none'}"><div><div class="banner-title">${escapeHTML(height)}</div><div class="banner-sub">${escapeHTML(p.district||'地區待查')} · ${escapeHTML(p.metro||'捷運待核')} · 屋齡${escapeHTML(ageText(p))}</div></div><div class="banner-housing"></div><div class="banner-index">#${p.seq}</div></div><div class="card-body"><div class="tags">${tagHTML(p)}</div><h3 class="card-name">${escapeHTML(p.name)}</h3><div class="card-location">${escapeHTML(p.district)} ${p.purpose?'／'+escapeHTML(p.purpose).slice(0,28):''}</div><div class="price-line"><div class="price">${money(p.price)}<small>萬</small></div><div class="unit-price">${p.price&&p.totalArea?'約 '+(p.price/p.totalArea).toFixed(1)+' 萬/坪':'單價待查'}</div></div><div class="card-specs"><div class="spec"><label>權狀坪數</label><b>${formatArea(p.totalArea)} 坪</b></div><div class="spec"><label>主建物坪數</label><b>${formatArea(p.mainArea)} 坪</b></div><div class="spec"><label>試算房貸/月</label><b>${monthly===null?'待查':money(monthly)+' 元'}</b></div></div><div class="card-note">${escapeHTML((p.specialRisk||p.cons||p.assessment||'尚未完成登記用途、屋況與在售查核'))}</div><div class="card-footer"><button class="btn small" data-detail="${p.id}">查看詳情 →</button><button title="${on?'取消':'加入'}比較" class="icon-btn ${on?'active':''}" data-compare="${p.id}">${icon('compare')}</button><button title="${p.favorite?'取消收藏':'收藏'}" class="icon-btn heart ${p.favorite?'active':''}" data-favorite="${p.id}">${icon('heart')}</button></div></div></article>`}
function tableHTML(items){return`<div class="table-wrap"><table class="prop-table"><thead><tr><th>比較</th><th>#</th><th>社區／戶別</th><th>地區</th><th>樓高證據</th><th>屋齡</th><th>開價</th><th>權狀</th><th>主建物</th><th>試算月付含管費</th><th>每日查核狀態</th><th>來源</th></tr></thead><tbody>${items.map(p=>`<tr><td><input type="checkbox" aria-label="加入比較" data-compare="${p.id}" ${state.compare.includes(p.id)?'checked':''}></td><td>${p.seq}</td><td><button class="linkish" data-detail="${p.id}">${escapeHTML(p.name)}</button></td><td>${escapeHTML(p.district)}</td><td>${escapeHTML(labels[p.heightType||'none'])}</td><td>${escapeHTML(ageText(p))}</td><td class="tprice">${money(p.price)}萬</td><td>${formatArea(p.totalArea)}</td><td>${formatArea(p.mainArea)}</td><td>${money(cardMonthly(p))}元</td><td title="${escapeHTML(p.checkReason||'')}">${escapeHTML(checkLabel(p))}</td><td>${p.url?`<a href="${escapeHTML(safeURL(p.url))}" rel="noopener noreferrer" target="_blank">刊登 ↗</a>`:'未附連結'}</td></tr>`).join('')}</tbody></table></div>`}
function renderResults(){let area=$('#results');if(!area)return;let items=filtered();const count=$('#resultCount');if(count)count.textContent=`顯示 ${items.length} 筆${state.dedup?'（合併重複後）':''}`;area.innerHTML=items.length?(state.table?tableHTML(items):`<div class="card-grid">${items.map(houseCard).join('')}</div>`):`<div class="empty">${icon('home')}<b>目前沒有符合篩選的房子</b><p>可以放寬價格／地區條件，或新增一筆房源。</p><button class="btn primary" data-action="clearFilters">清除篩選</button></div>`;renderCompareBar()}
function renderCompareBar(){const div=$('#compareBar');if(!div)return;div.className='compare-bar '+(state.compare.length?'show':'');div.innerHTML=`<strong style="font-size:12px">並排比較 ${state.compare.length}/4</strong><div class="compare-slots">${Array.from({length:4},(_,i)=>{let p=state.properties.find(x=>x.id===state.compare[i]);return`<span class="slot ${p?'':'empty'}">${p?escapeHTML(p.name).slice(0,14):'＋ 選一間'}</span>`}).join('')}</div><button class="btn small" data-nav="compare">開始比較 →</button><button class="btn small" data-action="clearCompare" style="background:transparent;color:#bdd3d5;border-color:#537079">清空</button>`}
function renderBrowse(){return headerHTML()+listingSummaryHTML()+filterHTML()}
function renderingComparison(){let props=state.compare.map(id=>state.properties.find(p=>p.id===id)).filter(Boolean);if(!props.length)return`<div class="intro"><div><div class="eyebrow">SIDE BY SIDE</div><h1 class="section-title">房屋並排比較</h1><p class="subtext">從房源卡片點選比較圖示，一次最多加入4間。</p></div><button class="btn" data-nav="height">返回挑高清單</button></div><div class="empty"><b>還沒選擇比較房屋</b><p>先勾選兩間以上，再看總價、實用坪數與每月負擔的差異。</p><button class="btn primary" data-nav="height">選擇房子</button></div>`;
const rows=[['開價（萬）',p=>p.price===null?'待查':`<strong>${money(p.price)} 萬</strong>`],['區域',p=>escapeHTML(p.district)],['屋齡',p=>escapeHTML(ageText(p))],['樓高 / 夾層',p=>escapeHTML(p.height?`${p.height}米 · ${labels[p.heightType]}`:labels[p.heightType])],['權狀坪數',p=>formatArea(p.totalArea)+' 坪'],['主建物坪數',p=>formatArea(p.mainArea)+' 坪'],['主建占比',p=>p.mainArea&&p.totalArea?(100*p.mainArea/p.totalArea).toFixed(1)+'%':'待查'],['每坪開價',p=>p.price&&p.totalArea?(p.price/p.totalArea).toFixed(1)+' 萬':'待查'],['頭期款（萬）',p=>p.price!==null?money(p.price*(1-state.finance.ltv/100)):'待查'],['房貸月付（元）',p=>money(mortgage(p))],['含管理費／月（元）',p=>`<strong>${money(cardMonthly(p))}</strong>`],['管理費（元）',p=>money(p.management)],['捷運',p=>escapeHTML(p.metro||'待查')],['本戶登記用途',p=>escapeHTML(p.purpose||'待查')],['最新狀態',p=>escapeHTML(checkLabel(p))]];
let markup=`<div class="intro"><div><div class="eyebrow">SIDE BY SIDE · ${props.length} PROPERTIES</div><h1 class="section-title">房源並排比較</h1><p class="subtext">同一組利率與貸款設定，直接比價格、實際主建物和月付。</p></div><button class="btn" data-action="clearCompare">清除比較</button></div>${financeHTML()}<div class="compare-page"><div class="compare-grid" style="--comp-count:${props.length}"><div class="compare-col labels"><div class="compare-head"><strong>比較項目</strong><div class="muted">最多四間</div></div>${rows.map(([label])=>`<div class="compare-cell">${label}</div>`).join('')}<div class="compare-cell"></div></div>${props.map(p=>`<div class="compare-col"><div class="compare-head"><div class="tag ${p.heightType.toLowerCase()}" style="display:inline-block">${labels[p.heightType]}</div><strong style="margin-top:9px">${escapeHTML(p.name)}</strong><div class="muted">#${p.seq} · ${escapeHTML(p.district)}</div></div>${rows.map(([,fn])=>`<div class="compare-cell">${fn(p)}</div>`).join('')}<div class="compare-cell"><button class="btn small" data-detail="${p.id}">詳情</button> <button class="btn small" data-compare="${p.id}">移除</button></div></div>`).join('')}</div></div><div class="notice">房貸為估算值，未含仲介費、契稅、修繕、房屋稅；部分房源可能是辦公室或工業用途，銀行實際核貸成數與利率會不同。</div>`;return markup;}
function financeHTML(){return`<div class="panel finance-panel"><div class="section-row" style="margin:0 0 14px"><h3>房貸試算設定</h3><small>所有房源即時計算</small></div><div class="slider-grid"><div class="field"><div class="range-head"><label>貸款成數</label><strong id="lvLtv">${state.finance.ltv}%</strong></div><input type="range" id="fLtv" min="40" max="90" step="5" value="${state.finance.ltv}"></div><div class="field"><div class="range-head"><label>年利率</label><strong id="lvRate">${state.finance.rate}%</strong></div><input type="range" id="fRate" min="1.5" max="5.5" step="0.1" value="${state.finance.rate}"></div><div class="field"><div class="range-head"><label>貸款年限</label><strong id="lvYears">${state.finance.years}年</strong></div><input type="range" id="fYears" min="15" max="40" step="5" value="${state.finance.years}"></div><div class="field"><label>每月住房預算（元）</label><input id="fTarget" type="number" min="0" step="1000" value="${state.finance.target}"></div></div></div>`}
function renderingInsights(){let hs=highCandidates();let priced=hs.filter(p=>p.price!==null);const target=state.finance.target;let sortedMonth=[...priced].sort((a,b)=>cardMonthly(a)-cardMonthly(b));let groups=[['A',hs.filter(p=>p.heightType==='A').length],['B',hs.filter(p=>p.heightType==='B').length],['C',hs.filter(p=>p.heightType==='C').length]];let maxMonth=Math.max(target,...sortedMonth.map(p=>cardMonthly(p)||0));return`<div class="intro"><div><div class="eyebrow">FINANCIAL REVIEW / REAL LIFE</div><h1 class="section-title">預算與挑高市場分析</h1><p class="subtext">使用你原表預設：貸款七成、年利率 2.5%、30 年、每月住房目標 20,000 元，可即時調整。</p></div><button class="btn primary" data-nav="height">回挑高房源</button></div>${statsHTML()}${financeHTML()}<div class="grid-two" style="display:grid;grid-template-columns:minmax(240px,1fr) minmax(300px,2fr);gap:16px"><section class="panel sync-card"><h3>挑高證據分布</h3><p>「挑高」指刊登宣稱，並不代表夾層已合法登記。</p>${groups.map(([k,n])=>`<div style="margin-top:20px"><div class="range-head"><span style="font-size:12px">${labels[k]}</span><strong>${n} 組</strong></div><div style="background:#e8eeee;height:10px;border-radius:20px;margin-top:8px"><div style="height:100%;width:${hs.length?100*n/hs.length:0}%;background:${k==='A'?'#0e9183':k==='B'?'#759dc3':'#cfa45f'};border-radius:20px"></div></div></div>`).join('')}</section><section class="panel sync-card"><h3>房貸 + 管理費（依月支出排序）</h3><p>房屋管理費缺資料時以0元暫算，因此顯示值是下限，不代表實際月付。</p>${sortedMonth.map(p=>{let m=cardMonthly(p)||0;return`<div style="display:grid;grid-template-columns:155px 1fr 85px;gap:9px;align-items:center;margin:12px 0;font-size:12px"><button style="text-align:left;background:none;border:0;color:#456774;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" data-detail="${p.id}">${escapeHTML(p.name)}</button><div style="height:13px;border-radius:9px;background:#ecf2f1;overflow:hidden"><div style="height:100%;width:${Math.min(100,100*m/maxMonth)}%;background:${m<=target?'#12a48d':'#a2b8c2'};border-radius:9px"></div></div><b style="text-align:right">${money(m)}</b></div>`}).join('')}<div class="muted">※ 不提供實價判定與可負擔性保證；請以銀行核貸與實際支出為準。</div></section></div><div class="notice">開價、管理費、可貸成數及法定用途均可能變更；已賣掉或下架應在房源內修改狀態，才會從篩選結果排除。</div>`}
function dataHTML(){return`<div class="intro"><div><div class="eyebrow">DATA STUDIO / SYNC</div><h1 class="section-title">資料同步與管理</h1><p class="subtext">你可以新增房源、批次匯入 CSV 或 JSON，也可連接 Google 試算表，網站由 GitHub 同站資料檔定時更新。</p></div><button class="btn primary" data-action="add">${icon('plus')} 新增房源</button></div><section class="panel sync-card"><h3>Google 試算表自動同步 <span class="tag b" style="vertical-align:middle">唯讀同步</span></h3><p>已連接「阿忠●住家研究●」房源資料庫。GitHub 每 15 分鐘嘗試讀取公開試算表，建立網站同站資料檔；網頁開啟時及每 5 分鐘讀取一次，不再依賴手機直接跨站讀取 Google。新增或修改房源請以 Google 試算表為準。排程可能略有延遲；本網站不會自行寫入 Google 試算表。</p><div class="field"><label>Google 試算表共用網址或公開 CSV 網址（需可匿名讀取）</label><input id="syncURL" placeholder="https://docs.google.com/spreadsheets/d/表單ID/edit#gid=0" value="${escapeHTML(state.sync.url||'')}"></div><div class="data-tools"><button class="btn primary" data-action="saveSync">儲存並嘗試同步</button><button class="btn" data-action="syncNow">立刻同步</button><button class="btn" data-action="disableSync">關閉自動同步</button></div><div id="syncReport" class="helptext" style="margin-top:10px">${state.sync.last?'上次同步：'+escapeHTML(state.sync.last):'尚未完成線上同步。'} ${state.sync.enabled?'目前為自動同步模式。':'目前關閉。'}</div><div class="notice"><b>資料公開提醒：</b>將試算表設為『知道連結的使用者可檢視』或『發布到網路』，都可能讓他人讀取資料。請只建立一份不含財務隱私、薪資與帳戶的公開房源表，切勿直接分享完整財務試算檔。若資料不願公開，請使用本機匯入。</div></section><section class="panel sync-card"><h3>備份與匯入</h3><p>網站新增與修改的房子存於「這台裝置的此瀏覽器」，並非雲端帳戶。建議定期匯出 JSON；匯入資料會依房源編號或完全相同的原始網址進行合併，不會因社區名稱相同就判定同戶。</p><div class="data-tools"><button class="btn dark" data-action="exportJSON">↓ 下載 JSON 完整備份</button><button class="btn" data-action="exportCSV">↓ 下載 CSV／Google Sheets</button><label class="btn" style="cursor:pointer">↑ 匯入 CSV / JSON <input id="fileImport" type="file" accept=".csv,.json,text/csv,application/json" style="display:none"></label></div><p class="helptext">你也可將這份 HTML 放到 GitHub Pages、Netlify 或其他靜態網站服務。若使用 Google Sheets 同步，同個網址的訪客會在 GitHub 資料鏡像更新後看到最新資料。<b>要讓新房源跨裝置同步，請直接新增到 Google 試算表；網站中的『新增房源』目前僅保存在本機瀏覽器。</b></p></section><section class="panel sync-card"><h3>網站運作規則</h3><div class="help-steps"><div>① 在「新增房源」貼入 <code>樂屋／591 分享文字</code>，自動辨識價格、坪數、連結；可自行補齊建物用途、主建物等資料。</div><div>② 新房子儲存後，立即加入「全部房源」，如設定挑高 A/B/C 類別，也會加入挑高清單。</div><div>③ 房源資料更新到 Google Sheets 並發布後，網站會定時重新載入；若更換公開連結，需在此重新設定。每日09:17另由 GitHub 自動查核原始刊登網址，更新頁面可讀／成交／下架／不明狀態；不將網址失效誤認為成交。</div><div>④ <b>ChatGPT 對話新增連結本身不會直接寫入網站：</b>需在網頁新增，或把資料新增到已連接的 Google 試算表。</div></div></section><section class="panel sync-card"><h3>還原與重設</h3><div class="data-tools"><button class="btn warn" data-action="resetAll">還原原始 60 筆（會清掉本機新增及修改）</button></div></section>`}
function render(){setNav();const host=$('#mainView');host.innerHTML=['height','all','favorites'].includes(state.page)?renderBrowse():state.page==='compare'?renderingComparison():state.page==='insights'?renderingInsights():dataHTML();if(['height','all','favorites'].includes(state.page))renderResults();renderCompareBar();}
function toggleCompare(id){const found=state.compare.indexOf(id);if(found>=0)state.compare.splice(found,1);else if(state.compare.length>=4)return notify('一次最多比較4間房屋');else state.compare.push(id);render()}
function toggleFavorite(id){let p=state.properties.find(x=>x.id===id);if(!p)return;p.favorite=!p.favorite;save();render();notify(p.favorite?'已加入收藏':'已取消收藏')}
function showDetail(id){let p=state.properties.find(x=>x.id===id);if(!p)return;const shell=$('#drawerShell');const data=[['區域',p.district],['總價',p.price!==null?money(p.price)+' 萬':'待查'],['權狀',formatArea(p.totalArea)+' 坪'],['主建物',formatArea(p.mainArea)+' 坪'],['屋齡',ageText(p)],['屋齡查核備註',p.ageNote||'尚未取得本戶資料'],['挑高 / 類型',(p.height?`${p.height} m・`:'')+labels[p.heightType]],['樓層',p.floor||'待查'],['房型',p.rooms||'待查'],['近捷運',p.metro||'待查'],['管理費/月',yes(p.management)?money(p.management)+' 元':'待查'],['房貸月付',money(mortgage(p))+' 元'],['房貸＋管理費',money(cardMonthly(p))+' 元（管理費缺漏未計）'],['法定用途（原資料）',p.purpose||'待查'],['車位',p.parking||'待查'],['每日查核',checkLabel(p)],['查核日期',p.checkedAt||'尚未查核'],['查核依據',p.checkReason||'僅供參考']];shell.innerHTML=`<div class="drawer-shade show" id="detailShade"><aside class="drawer" role="dialog" aria-modal="true" aria-label="房屋詳細資訊"><div class="drawer-head"><button class="btn small ghost" style="float:right;background:#ffffff18;color:white;border-color:#ffffff44" data-action="closeDrawer">✕ 關閉</button><div style="color:#ace5dd;font-size:11px;letter-spacing:2px">PROPERTY FILE / #${p.seq}</div><h2>${escapeHTML(p.name)}</h2><div style="opacity:.8;font-size:13px">${escapeHTML(p.district)}　${escapeHTML(p.metro||'捷運待核')}</div><div style="font-weight:850;font-size:29px;margin-top:15px">${money(p.price)} <span style="font-size:13px">萬元</span></div></div><div class="drawer-content"><div class="tags">${tagHTML(p)}</div><div class="drawer-section" style="margin-top:8px;border:0;padding:0"><h4>基本資料</h4>${data.map(([l,v])=>`<div class="detail-pair"><span>${escapeHTML(l)}</span><b>${escapeHTML(v)}</b></div>`).join('')}</div><div class="drawer-section"><h4>評估備註</h4><p class="muted">${escapeHTML(p.assessment||'尚無評估')}</p><div class="callout">${escapeHTML(p.pros||'優勢尚未查證')}</div><div class="callout warn" style="margin-top:10px">${escapeHTML(p.specialRisk||p.cons||'應查用途、產權、在售狀態與夾層合法性')}</div></div><div class="drawer-section"><h4>房源連結</h4><div class="detail-actions">${p.url?`<a class="btn primary" target="_blank" rel="noopener noreferrer" href="${escapeHTML(safeURL(p.url))}">${icon('link')} 開啟原始房源</a>`:'<span class="muted">原始刊登網址缺漏</span>'}${p.extraUrl?`<a class="btn" target="_blank" rel="noopener noreferrer" href="${escapeHTML(safeURL(p.extraUrl))}">交叉參考 ↗</a>`:''}</div><p class="muted">${escapeHTML(p.verification||p.sourceNote||'價格與刊登狀態尚待確認')}</p></div><div class="drawer-section"><h4>紀錄管理</h4><div class="detail-actions"><button class="btn dark" data-edit="${p.id}">編輯資料</button><button class="btn" data-compare="${p.id}">${state.compare.includes(p.id)?'取消比較':'加入比較'}</button><button class="btn" data-favorite="${p.id}">${p.favorite?'取消收藏':'加入收藏'}</button>${p.origin==='custom'?`<button class="btn warn" data-delete="${p.id}">刪除房源</button>`:''}</div></div><div class="notice">本網站是個人決策工作台；廣告宣稱挑高或有夾層不等於法定合法使用。請向仲介索取本戶謄本及竣工核准圖說。</div></div></aside></div>`;document.body.style.overflow='hidden';}
function closeDrawer(){let shell=$('#drawerShell');shell.innerHTML='';document.body.style.overflow=''}
const districts=['中和','永和','板橋','三重','土城','新莊','新店','淡水','龜山','萬華','其他'];
function showForm(id){let existing=id?state.properties.find(p=>p.id===id):null;let p=existing||{name:'',district:'中和',price:null,totalArea:null,mainArea:null,management:null,heightType:'none',height:null,rooms:'',metro:'',floor:'',ageYears:null,ageNote:'',purpose:'',listingStatus:'unverified',cons:'',url:'',related:''};closeDrawer();let modal=$('#modalShell');modal.innerHTML=`<div class="modal-shade show" id="formShade"><div class="modal" role="dialog" aria-modal="true" aria-label="${existing?'編輯':'新增'}房源"><div class="modal-top"><h3>${existing?'編輯房源 #'+existing.seq:'新增房屋到網站'}</h3><button class="icon-btn" data-action="closeModal">${icon('close')}</button></div><div class="modal-body"><form id="propForm"><div class="mode-note">${existing?'修改後會在本機立即更新。若啟用公開 Google Sheet 同步，同編號資料可能在下一次同步時被線上資料覆蓋。':'可先貼樂屋／591 分享文字，點「從文字帶入」就能填入名稱、行政區、價格、坪數和連結。沒有的資料保持空白即可。'}</div><div class="field" style="margin-bottom:10px"><label>貼上房屋分享文字（非必填）</label><textarea id="pasteListing" rows="3" placeholder="Hi，我想跟你分享一則房屋資訊：新北市中和區… 15.12坪，998萬，https://..."></textarea></div><button class="btn small" type="button" data-action="parseText" style="margin-bottom:17px">✦ 從分享文字帶入欄位</button><div class="form-grid"><div class="field span2"><label>房屋／社區名稱 *</label><input id="pName" required value="${escapeHTML(p.name)}" placeholder="例如：華中捷仕堡・14樓"></div><div class="field"><label>行政區</label><select id="pDistrict">${[...new Set([...districts,...districtList()])].map(d=>`<option ${p.district===d?'selected':''}>${escapeHTML(d)}</option>`).join('')}</select></div><div class="field"><label>刊登開價（萬元）</label><input id="pPrice" type="number" min="0" step="0.1" value="${yes(p.price)?p.price:''}"></div><div class="field"><label>權狀坪數</label><input id="pTotal" type="number" min="0" step="0.01" value="${yes(p.totalArea)?p.totalArea:''}"></div><div class="field"><label>主建物坪數（不含非法加蓋）</label><input id="pMain" type="number" min="0" step="0.01" value="${yes(p.mainArea)?p.mainArea:''}"></div><div class="field"><label>屋齡（年）</label><input id="pAge" type="number" min="0" max="120" step="0.1" value="${buildingAge(p)===null?'':buildingAge(p)}" placeholder="未知請留空"></div><div class="field"><label>屋齡資料來源／備註</label><input id="pAgeNote" value="${escapeHTML(p.ageNote||'')}" placeholder="例如：591刊登約15年；待謄本核對"></div><div class="field"><label>房型</label><input id="pRooms" value="${escapeHTML(p.rooms)}" placeholder="2房1廳1衛"></div><div class="field"><label>樓層</label><input id="pFloor" value="${escapeHTML(p.floor||'')}" placeholder="14 / 19樓"></div><div class="field"><label>挑高／樓中樓證據分類</label><select id="pKind">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${p.heightType===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>挑高高度（公尺）</label><input id="pHeight" type="number" min="0" max="12" step="0.1" value="${yes(p.height)?p.height:''}" placeholder="例如4.3"></div><div class="field"><label>管理費（元／月）</label><input id="pManagement" type="number" min="0" step="1" value="${yes(p.management)?p.management:''}"></div><div class="field"><label>最近捷運站／通勤</label><input id="pMetro" value="${escapeHTML(p.metro)}" placeholder="例如：中和站"></div><div class="field span2"><label>登記用途／查核情況</label><input id="pPurpose" value="${escapeHTML(p.purpose)}" placeholder="住家用／一般事務所／待查"></div><div class="field"><label>刊登狀態</label><select id="pStatus"><option value="unverified" ${p.listingStatus==='unverified'?'selected':''}>未再次核實</option><option value="confirmed" ${p.listingStatus==='confirmed'?'selected':''}>人工確認在售</option><option value="sold" ${p.listingStatus==='sold'?'selected':''}>已成交／下架</option></select></div><div class="field"><label>相關／重複房源備註</label><input id="pRelated" value="${escapeHTML(p.related||'')}" placeholder="如：可能與#55同戶，待核對"></div><div class="field span2"><label>房源網址</label><input id="pUrl" type="url" value="${escapeHTML(p.url)}" placeholder="https://www.rakuya.com.tw/..."></div><div class="field span2"><label>缺點、合法性、看屋提醒</label><textarea id="pCons" rows="2">${escapeHTML(p.cons||'')}</textarea></div></div><div class="form-actions"><button class="btn" type="button" data-action="closeModal">取消</button><button class="btn primary" type="submit">${existing?'儲存修改':'新增並加入清單'}</button></div></form></div></div></div>`;modal.dataset.edit=id||'';document.body.style.overflow='hidden';}
function closeModal(){let modal=$('#modalShell');modal.innerHTML='';modal.dataset.edit='';document.body.style.overflow=''}
function parseListing(text){const url=(text.match(/https?:\/\/[^\s，,。<>"']+/)||[])[0]||'';let district=(text.match(/(?:新北市|台北市|臺北市|桃園市)([^\s，,\-－]{2,4}區)/)||[])[1]||'';let houseDesc=(text.match(/(?:新北市|台北市|臺北市|桃園市).{2,20}?[區路街巷]\s*[-－–]\s*([^，,\n]+)/)||[])[1]||'';let priceMatch=text.match(/([\d,，]+(?:\.\d+)?)\s*萬/);let price=priceMatch?number(priceMatch[1]):null;let areaMatch=text.match(/([\d.]+)\s*坪/);let area=areaMatch?number(areaMatch[1]):null;let rooms=(text.match(/\d+房\d+廳\d+衛/)||[])[0]||'';let ageMatch=text.match(/屋齡\s*(?:約)?\s*([\d.]+)\s*年/);let ageYears=ageMatch?number(ageMatch[1]):null;let heightMatch=text.match(/挑高\s*([\d.]+)\s*(?:米|m\b)/i);let height=heightMatch?number(heightMatch[1]):null;let h=(/夾層|樓中樓|加蓋/.test(text)?'B':height?'A':'none');return {url:safeURL(url),name:houseDesc.trim()||'',district:district||'',price,area,rooms,height,heightType:h,ageYears};}
function fillFromText(){let v=parseListing($('#pasteListing')?.value||'');if(v.name)$('#pName').value=v.name;if(v.district){let sel=$('#pDistrict');if([...sel.options].some(o=>o.value===v.district))sel.value=v.district}if(v.price!==null)$('#pPrice').value=v.price;if(v.area!==null)$('#pTotal').value=v.area;if(v.rooms)$('#pRooms').value=v.rooms;if(v.ageYears!==null){$('#pAge').value=v.ageYears;$('#pAgeNote').value='分享文字屋齡（約略，待本戶謄本核實）'}if(v.height!==null)$('#pHeight').value=v.height;if(v.heightType!=='none')$('#pKind').value=v.heightType;if(v.url)$('#pUrl').value=v.url;notify('已帶入可辨識欄位；主建物與合法用途請再查證')}
function saveForm(){let form=$('#propForm');if(!form.reportValidity())return;let id=$('#modalShell').dataset.edit;let p=state.properties.find(x=>x.id===id);const url=safeURL($('#pUrl').value.trim());const duplicate=url?state.properties.find(x=>x.id!==id && x.url&&safeURL(x.url)===url):null;if(duplicate&&!window.confirm(`相同原始網址已存在：#${duplicate.seq} ${duplicate.name}。仍要新增／另存？`))return;
const fields={name:$('#pName').value.trim(),district:$('#pDistrict').value.trim(),price:number($('#pPrice').value),totalArea:number($('#pTotal').value),mainArea:number($('#pMain').value),ageYears:number($('#pAge').value),ageNote:$('#pAgeNote').value.trim(),rooms:$('#pRooms').value.trim(),floor:$('#pFloor').value.trim(),heightType:$('#pKind').value,height:number($('#pHeight').value),management:number($('#pManagement').value),metro:$('#pMetro').value.trim(),purpose:$('#pPurpose').value.trim(),listingStatus:$('#pStatus').value,url,related:$('#pRelated').value.trim(),cons:$('#pCons').value.trim(),updatedAt:new Date().toISOString().slice(0,10)};
if(!p){let nextSeq=Math.max(60,...state.properties.map(x=>number(x.seq)||0))+1;p={id:'H'+String(nextSeq).padStart(3,'0'),seq:nextSeq,origin:'custom',addedAt:new Date().toISOString().slice(0,10),favorite:false,pros:'',assessment:'新加入・待評估',sourceNote:'由購屋網站新增',verification:'待核'};state.properties.push(p)}Object.assign(p,fields);save();closeModal();state.page=isHigh(p)?'height':'all';state.q='';state.kind='all';state.ageRange='all';state.onlyBudget=false;render();notify(`已儲存 ${p.name}，清單目前 ${state.properties.length} 筆`)}
function removeProperty(id){let p=state.properties.find(x=>x.id===id);if(!p||p.origin!=='custom')return;if(!window.confirm(`確定刪除 ${p.name}？`))return;state.properties=state.properties.filter(x=>x.id!==id);state.compare=state.compare.filter(x=>x!==id);save();closeDrawer();render();notify('已刪除房源')}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const csvFields=[['編號','seq'],['房屋／社區','name'],['區域','district'],['參考價（萬元）','price'],['主建物（坪）','mainArea'],['權狀（坪）','totalArea'],['管理費（元／月）','management'],['法定用途／查核','purpose'],['車位','parking'],['評估結論','assessment'],['優點','pros'],['缺點與風險','cons'],['重複／關聯','related'],['原始網址','url'],['資料說明','sourceNote'],['挑高類型','heightType'],['挑高高度(m)','height'],['房型','rooms'],['捷運','metro'],['刊登狀態','listingStatus'],['樓層','floor'],['屋齡（年）','ageYears'],['屋齡來源／查核','ageNote']];
function quoteCSV(x){let v=String(x??'');return '"'+v.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[csvFields.map(([k])=>k),...state.properties.map(p=>csvFields.map(([,k])=>p[k]??''))];download('購屋房源資料_可同步GoogleSheet.csv','\uFEFF'+rows.map(r=>r.map(quoteCSV).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV 已產生，可匯入 Google 試算表')}
function exportJSON(){download('購屋比較網站_全部資料備份.json',JSON.stringify({version:2,exportAt:new Date().toISOString(),properties:state.properties,finance:state.finance},null,2),'application/json');notify('JSON 完整備份已產生')}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else quoted=false}else cell+=c}else if(c==='"'){quoted=true}else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell.replace(/\r$/,''));if(row.some(x=>x.trim()))rows.push(row);return rows}
function normalizeRows(rows){if(!rows.length)return[];let header=rows[0].map(h=>String(h??'').trim().replace(/^\uFEFF/,''));return rows.slice(1).map(row=>{let p={};for(let c=0;c<header.length;c++){let key=mapping[header[c]];if(key)p[key]=row[c]}}).filter(x=>x.name||x.url).map(p=>normalizeProp(p));}
function normalizeProp(item){let o={...item};for(let k of ['seq','price','mainArea','totalArea','management','height','ageYears'])if(k in o)o[k]=number(o[k]);if(o.heightType&&!['A','B','C','none'].includes(o.heightType)){o.heightType=/^A/.test(o.heightType)?'A':/^B/.test(o.heightType)?'B':/^C/.test(o.heightType)?'C':'none'}if(o.url)o.url=safeURL(o.url);return o}
function mergeImported(items){
  if(!Array.isArray(items))throw new Error('同步來源不是房源清單');
  let inserted=0,changed=0,invalid=0;
  if(!Array.isArray(state.properties))state.properties=SEED_PROPERTIES.map(x=>({...x}));
  state.properties=state.properties.filter(p=>p&&typeof p==='object'&&p.id&&p.name);
  const bySeq=new Map(),byUrl=new Map();
  for(const p of state.properties){
    if(p.seq!==null&&p.seq!==undefined)bySeq.set(Number(p.seq),p);
    if(p.url)byUrl.set(p.url,p);
  }
  for(const item of items){
    if(!item||typeof item!=='object'){invalid++;continue}
    const p=normalizeProp(item);
    if(!p.name||!p.seq){invalid++;continue}
    const seq=Number(p.seq);
    if(!Number.isInteger(seq)||seq<1){invalid++;continue}
    const exact=bySeq.get(seq)||(p.url?byUrl.get(p.url):null);
    if(exact){
      let dirty=false;
      for(const [k,v] of Object.entries(p)){
        if(k==='id'||k==='duplicateGroup'||k==='favorite'||v===undefined||v===null||v==='')continue;
        if(exact[k]!==v){exact[k]=v;dirty=true}
      }
      if(dirty){exact.updatedAt=new Date().toISOString().slice(0,10);changed++}
    }else{
      let id='H'+String(seq).padStart(3,'0');
      if(state.properties.some(x=>x.id===id))id+='_'+Date.now();
      const next={id,seq,name:p.name,district:p.district||'待查',price:null,mainArea:null,totalArea:null,management:null,heightType:'none',height:null,origin:'import',listingStatus:'unverified',addedAt:new Date().toISOString().slice(0,10),favorite:false,...p,updatedAt:new Date().toISOString().slice(0,10)};
      state.properties.push(next);bySeq.set(seq,next);if(next.url)byUrl.set(next.url,next);inserted++;
    }
  }
  if(inserted||changed){applyChecks();save();render()}
  return{inserted,changed,invalid}
}
async function importFile(file){try{const t=await file.text();let items;if(file.name.toLowerCase().endsWith('.json')){const obj=JSON.parse(t);items=Array.isArray(obj)?obj:obj.properties;if(!Array.isArray(items))throw new Error('JSON 中沒有 properties 陣列')}else{items=normalizeRows(parseCSV(t))}let stats=mergeImported(items);notify(`匯入完成：新增${stats.inserted}筆、更新${stats.changed}筆`)}catch(e){notify('無法匯入：'+e.message)}}
// Public Google Sheets share URLs use JSONP via Google Visualization; no API key and no browser CORS fetch needed.
// Canonical Google Sheet is mirrored by GitHub Actions as a same-origin JSON file.
// This avoids mobile CORS, CSP and JSONP failures. The mirror is refreshed every 15 minutes.
async function sameOriginPropertyRows(){
  const resp=await fetch('./sheet-data.json?stamp='+Date.now(),{cache:'no-store'});
  if(!resp.ok)throw new Error('網站資料鏡像尚未就緒（HTTP '+resp.status+'）');
  const doc=await resp.json();
  if(!doc||typeof doc!=='object')throw new Error('同步資料回應格式錯誤');
  if(doc.schemaVersion!==1||!Array.isArray(doc.items)||doc.items.length<60||
     doc.sheetId!=='1XP_8GXN9QRKbEGqYzBudjOYazADMJqYFf8gqMiADgS8')
    throw new Error('網站房源資料格式不符，已保留原本資料');
  return doc.items.filter(x=>x&&typeof x==='object'&&typeof x.name==='string'&&x.name.trim()&&x.seq).map(x=>normalizeProp(x));
}
function publicGoogleRows(rawUrl){return new Promise((resolve,reject)=>{let u;try{u=new URL(rawUrl)}catch{return reject(new Error('試算表網址格式不正確'))}
const id=u.pathname.match(/^\/spreadsheets\/d\/([A-Za-z0-9_-]+)\//);if(!id || u.hostname!=='docs.google.com')return reject(new Error('請使用 Google 試算表的原始共用連結'));
const hash=new URLSearchParams(u.hash.replace(/^#/,''));const gid=u.searchParams.get('gid')||hash.get('gid')||'0';
const callback='houseDataCallback_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const query=`https://docs.google.com/spreadsheets/d/${id[1]}/gviz/tq?tqx=${encodeURIComponent('out:json;responseHandler:'+callback)}&gid=${encodeURIComponent(gid)}&headers=1`;
let timer,script=document.createElement('script'),done=false;
const clean=()=>{clearTimeout(timer);delete window[callback];script.remove()};
window[callback]=resp=>{if(done)return;done=true;clean();try{if(resp.status==='error')throw Error(resp.errors?.[0]?.message||'無權讀取試算表');let tb=resp.table;if(!tb||!tb.cols)throw Error('試算表回應沒有欄位');let hs=tb.cols.map(c=>c.label||c.id||'');let rows=[hs,...(tb.rows||[]).map(row=>(row.c||[]).map(c=>c?.v??''))];let items=normalizeRows(rows);if(!items.length)throw Error('找不到房屋欄位，請確認第一列為標題列');resolve(items)}catch(e){reject(e)}};
script.onerror=()=>{if(done)return;done=true;clean();reject(new Error('連線失敗；請將試算表設為知道連結即可檢視'))};timer=setTimeout(()=>{if(done)return;done=true;clean();reject(new Error('Google 試算表查詢逾時'))},12000);
script.src=query;document.head.appendChild(script)})}
async function syncNow(){const input=$('#syncURL');let url=(input?.value??state.sync.url??'').trim();if(!safeURL(url))return notify('請輸入有效的 HTTPS 試算表網址');if(!/^https:\/\//.test(url))return notify('只接受 HTTPS 網址');$('#syncHint').textContent='同步中…';try{let items;
if(url.includes('/spreadsheets/d/1XP_8GXN9QRKbEGqYzBudjOYazADMJqYFf8gqMiADgS8/')){items=await sameOriginPropertyRows()}
else if(/^https:\/\/docs\.google\.com\/spreadsheets\/d\/(?!e\/)/.test(url)){items=await publicGoogleRows(url)}
else {if(!/\.csv($|\?)|[?&](output|format)=csv(?:&|$)/i.test(url))throw Error('請使用 Google 試算表共用連結，或公開 CSV 網址');const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const text=await res.text();if(/<html[\s>]/i.test(text.slice(0,400)))throw Error('回傳登入頁而非 CSV，請確認已發布到網路');items=normalizeRows(parseCSV(text))}
if(!items.length)throw Error('找不到資料（至少需要 房屋／社區 和 編號 欄位）');const info=mergeImported(items);state.sync.last=new Date().toLocaleString('zh-TW');storageSave(CONFIG_KEY,state.sync);setNav();const rpt=$('#syncReport');if(rpt)rpt.textContent=`上次同步：${state.sync.last}，房源共${state.properties.length}筆（本次新增${info.inserted}、同步${info.changed}）`;notify(`同步成功：新增${info.inserted}、更新${info.changed}筆`)}catch(e){console.error('房源同步詳細錯誤',e.stack||e);notify('線上同步失敗：'+e.message);$('#syncHint').textContent='同步需檢查';let rpt=$('#syncReport');if(rpt)rpt.textContent='同步失敗：'+e.message+'（既有房源已保留，請稍後再試，或查看 GitHub 同步任務）'}}

function nav(p){state.page=p;state.q='';state.kind='all';state.ageRange='all';state.priceMax=0;state.district='全部地區';state.onlyBudget=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function act(name){switch(name){case'add':showForm();break;case'closeDrawer':closeDrawer();break;case'closeModal':closeModal();break;case'parseText':fillFromText();break;case'clearCompare':state.compare=[];render();break;case'clearFilters':state.q='';state.district='全部地區';state.kind='all';state.ageRange='all';state.priceMax=0;state.onlyBudget=false;state.order='recommended';render();break;case'budgetToggle':state.onlyBudget=!state.onlyBudget;render();break;case'dedupToggle':state.dedup=!state.dedup;render();break;case'statusToggle':state.status=state.status==='exclude'?'all':'exclude';render();break;case'sortRecommended':state.order='recommended';render();break;case'viewCards':state.table=false;render();break;case'viewTable':state.table=true;render();break;case'exportCSV':exportCSV();break;case'exportJSON':exportJSON();break;case'syncNow':syncNow();break;case'saveSync':state.sync.url=($('#syncURL')?.value||'').trim();state.sync.enabled=true;storageSave(CONFIG_KEY,state.sync);syncNow();break;case'disableSync':state.sync.enabled=false;storageSave(CONFIG_KEY,state.sync);setNav();notify('已停用線上自動同步');break;case'resetAll':if(window.confirm('確定清除本機新增、編輯與收藏，還原到原始60筆嗎？建議先匯出JSON備份。')){state.properties=SEED_PROPERTIES.map(p=>({...p}));state.compare=[];save();render();notify('已還原原始資料')}break;}}
// Delegated UI actions.
document.addEventListener('click',e=>{const target=e.target.closest('[data-nav],[data-action],[data-detail],[data-edit],[data-delete],[data-compare],[data-favorite]');if(!target)return;if(target.dataset.nav){nav(target.dataset.nav);return}if(target.dataset.detail){showDetail(target.dataset.detail);return}if(target.dataset.edit){showForm(target.dataset.edit);return}if(target.dataset.delete){removeProperty(target.dataset.delete);return}if(target.dataset.compare){toggleCompare(target.dataset.compare);return}if(target.dataset.favorite){toggleFavorite(target.dataset.favorite);return}if(target.dataset.action){act(target.dataset.action);return}});
document.addEventListener('submit',e=>{if(e.target.id==='propForm'){e.preventDefault();saveForm()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='fDistrict'){state.district=el.value;render()}if(el.id==='fKind'){state.kind=el.value;render()}if(el.id==='fAge'){state.ageRange=el.value;render()}if(el.id==='fPrice'){state.priceMax=Number(el.value);render()}if(el.id==='fSort'){state.order=el.value;render()}if(el.id==='fTarget'){state.finance.target=Number(el.value)||20000;render()}if(el.id==='fileImport'&&el.files&&el.files[0])importFile(el.files[0])});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='fSearch'){state.q=e.target.value;renderResults()}if(['fLtv','fRate','fYears'].includes(id)){const map={fLtv:['ltv','lvLtv','%'],fRate:['rate','lvRate','%'],fYears:['years','lvYears','年']};let [k,label,suffix]=map[id];state.finance[k]=Number(e.target.value);let l=$('#'+label);if(l)l.textContent=state.finance[k]+suffix;let old=window._financeDebounce;clearTimeout(old);window._financeDebounce=setTimeout(()=>render(),250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
document.addEventListener('click',e=>{if(e.target.id==='detailShade')closeDrawer();if(e.target.id==='formShade')closeModal()});
applyChecks();render();loadListingChecks();if(state.sync.enabled && state.sync.url)syncNow();syncInterval=setInterval(()=>{if(state.sync.enabled&&state.sync.url)syncNow()},300000);setInterval(loadListingChecks,900000);
</script>
